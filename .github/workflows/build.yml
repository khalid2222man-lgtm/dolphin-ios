      - name: Show toolchain
        run: |
          xcodebuild -version
          clang --version | head -1
          ls /Applications | grep -i xcode || true

      - name: Install build tools
        run: brew install cmake ninja bartycrouch

      - name: Build (Release, Non-Jailbroken)
        run: |
          xcodebuild archive \
            -project Source/iOS/App/DolphiniOS.xcodeproj \
            -scheme "DiOS (NJB)" \
            -configuration "Release (Non-Jailbroken)" \
            -archivePath "$GITHUB_WORKSPACE/archives/NonJailbroken.xcarchive" \
            -derivedDataPath "$GITHUB_WORKSPACE/build-Xcode" \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            DOL_PBID_ORGANIZATION_IDENTIFIER="$ORG_ID" \
            DOL_BUILD_SOURCE="development" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -DFMT_CONSTEVAL= -DFMT_USE_CONSTEVAL=0' \
            OTHER_CFLAGS='$(inherited) -DFMT_CONSTEVAL= -DFMT_USE_CONSTEVAL=0'

      - name: Package unsigned IPA
        run: |
          mkdir -p products/Payload
          cp -R "archives/NonJailbroken.xcarchive/Products/Applications/DolphiniOS.app" products/Payload/
          cd products
          zip -qry DolphiniOS-Plus-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-Plus-unsigned-ipa
          path: products/DolphiniOS-Plus-unsigned.ipa
          if-no-files-found: error
