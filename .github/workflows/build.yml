name: Build DolphiniOS Plus IPA

# One-file setup: applies the DolphiniOS Plus changes (external USB/SD games folder) plus a build fix
# for Xcode 26.4+ (fmt consteval) to the source, builds an UNSIGNED .ipa on a free GitHub-hosted Mac,
# and uploads it as an artifact. Sign/install the IPA with Sideloadly or AltStore.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      ORG_ID: com.example.dolphiniosplus

